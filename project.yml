name: XunJian
options:
  minimumXcodeGenVersion: 2.40.0
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 14.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleName: 寻简
    INFOPLIST_KEY_CFBundleDisplayName: 寻简
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 2
    XUNJIAN_UPDATE_FEED_URL: "https://lifet.github.io/XunJian/appcast.xml"
    XUNJIAN_UPDATE_PUBLIC_ED_KEY: "ZYFomhdgXrbr3EfU48QESGuhKDhA5PuqEehJSzXPU1Q="
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    version: 2.9.5
targets:
  XunJian:
    type: application
    platform: macOS
    sources:
      - path: XunJian
        excludes:
          - XunJian.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingmingbo.XunJian
        PRODUCT_NAME: 寻简
        PRODUCT_MODULE_NAME: XunJian
        CODE_SIGN_ENTITLEMENTS: XunJian/XunJian.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: 14.0
    info:
      path: XunJian/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSServices:
          - NSMenuItem:
              default: 用寻简打开
            NSMessage: openPathsService
            NSSendTypes:
              - public.file-url
        SUFeedURL: $(XUNJIAN_UPDATE_FEED_URL)
        SUPublicEDKey: $(XUNJIAN_UPDATE_PUBLIC_ED_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: false
    entitlements:
      path: XunJian/XunJian.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    dependencies:
      - target: XunJianOAuthBridge
      - package: Sparkle
  XunJianOAuthBridge:
    type: xpc-service
    platform: macOS
    preBuildScripts:
      - name: Verify Bundled OAuth Runtimes
        script: |
          /bin/zsh "$SRCROOT/scripts/verify-bundled-oauth-runtimes.sh"
        inputFiles:
          - $(SRCROOT)/scripts/verify-bundled-oauth-runtimes.sh
          - $(SRCROOT)/XunJianOAuthBridge/Resources/CodexAppServer/arm64/codex-app-server
          - $(SRCROOT)/XunJianOAuthBridge/Resources/CodexAppServer/x86_64/codex-app-server
          - $(SRCROOT)/XunJianOAuthBridge/Resources/GrokRuntime/arm64/grok
          - $(SRCROOT)/XunJianOAuthBridge/Resources/GrokRuntime/x86_64/grok
        basedOnDependencyAnalysis: false
    sources:
      - path: XunJianOAuthBridge
        excludes:
          - Resources
      - path: XunJianOAuthBridge/Resources/CodexAppServer
        type: folder
        buildPhase: resources
      - path: XunJianOAuthBridge/Resources/GrokRuntime
        type: folder
        buildPhase: resources
      - path: XunJian/Infrastructure/OAuthBridgeProtocol.swift
    info:
      path: XunJianOAuthBridge/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingmingbo.XunJian.OAuthBridge
        PRODUCT_NAME: XunJianOAuthBridge
        PRODUCT_MODULE_NAME: XunJianOAuthBridge
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
  XunJianTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: XunJianTests
        excludes:
          - OAuthProcessTests.swift
      - path: XunJianOAuthBridge/Core
    dependencies:
      - target: XunJian
      - target: XunJianUnauthorizedClient
      - target: XunJianUntrustedOAuthBridge
      - target: XunJianFakeJSONLServer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingmingbo.XunJianTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/寻简.app/Contents/MacOS/寻简"
        BUNDLE_LOADER: "$(TEST_HOST)"
  XunJianOAuthProcessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: XunJianTests/OAuthProcessTests.swift
      - path: XunJianOAuthBridge/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingmingbo.XunJianOAuthProcessTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: NO
  XunJianFakeJSONLServer:
    type: application
    platform: macOS
    sources:
      - path: XunJianTests/OAuthProtocolClientTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.XunJianFakeJSONLServer
        PRODUCT_NAME: XunJianFakeJSONLServer
        INFOPLIST_KEY_LSBackgroundOnly: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: XUNJIAN_FAKE_JSONL_SERVER
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
  XunJianUnauthorizedClient:
    type: application
    platform: macOS
    sources:
      - path: XunJianTests/OAuthBridgeTests.swift
      - path: XunJian/Infrastructure/OAuthBridgeProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.XunJianUnauthorizedClient
        PRODUCT_NAME: XunJianUnauthorizedClient
        INFOPLIST_KEY_LSBackgroundOnly: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: XUNJIAN_UNAUTHORIZED_CLIENT
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
    dependencies:
      - target: XunJianOAuthBridge
  XunJianUntrustedOAuthBridge:
    type: xpc-service
    platform: macOS
    sources:
      - path: XunJianTests/OAuthBridgeTests.swift
      - path: XunJian/Infrastructure/OAuthBridgeProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.XunJianUntrustedOAuthBridge
        PRODUCT_NAME: XunJianUntrustedOAuthBridge
        PRODUCT_MODULE_NAME: XunJianUntrustedOAuthBridge
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: XUNJIAN_UNTRUSTED_BRIDGE
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XunJianOAuthBridge/Info.plist
        SKIP_INSTALL: YES
schemes:
  XunJian:
    build:
      targets:
        XunJian: all
        XunJianOAuthBridge: all
        XunJianTests: [test]
        XunJianOAuthProcessTests: [test]
        XunJianFakeJSONLServer: [test]
    test:
      gatherCoverageData: false
      targets:
        - XunJianTests
        - XunJianOAuthProcessTests
